<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Asistencia</title>
    <!-- Librería para leer códigos QR con la cámara -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <!-- Enlace a tu archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <h2>Control de Asistencia</h2>
        
        <!-- Contenedor para ingresar ID manual o escanear -->
        <div id="input-container">
            <p>Ingresa tu ID de empleado o escanea tu QR</p>
            <input type="text" id="idEmpleado" placeholder="Ej: NG-6491">
            <button onclick="guardarUsuarioManual()">Guardar ID</button>
            <button class="btn-secundario" onclick="toggleScanner()">Escanear QR</button>
            <div id="reader" class="oculto"></div>
        </div>

        <!-- Contenedor cuando el usuario ya está identificado -->
        <div id="panel-fichaje" class="oculto">
            <p>Bienvenido/a, <strong id="lbl-usuario"></strong></p>
            <button onclick="registrarFichaje('Entrada')">Registrar ENTRADA</button>
            <button class="btn-salida" onclick="registrarFichaje('Salida')">Registrar SALIDA</button>
            <button class="btn-secundario" onclick="cambiarUsuario()">Cambiar de Usuario / ID</button>
        </div>

        <p id="mensaje"></p>
    </div>

    <!-- Enlace a tu archivo de lógica JS -->
    <script src="script.js"></script>
</body>
</html>
